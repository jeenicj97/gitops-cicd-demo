<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo-CI/CD</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="card">
    <span class="badge">POC</span>
    <h1>EKS Deployment POC</h1>
    <p class="subtitle">Flask &rarr; Docker &rarr; GitHub Actions &rarr; ArgoCD &rarr; Helm &rarr; EKS</p>

    <div class="grid">
      <div class="stat">
        <span class="label">Version</span>
        <span class="value">{{ version }}</span>
      </div>
      <div class="stat">
        <span class="label">Environment</span>
        <span class="value">{{ environment }}</span>
      </div>
      <div class="stat">
        <span class="label">Pod / Hostname</span>
        <span class="value">{{ hostname }}</span>
      </div>
      <div class="stat">
        <span class="label">Server Time (UTC)</span>
        <span class="value">{{ server_time }}</span>
      </div>
    </div>

    <div class="footer">
      Probes: <code>/healthz</code> (liveness) &middot; <code>/readyz</code> (readiness)
    </div>
  </div>
</body>
</html>
